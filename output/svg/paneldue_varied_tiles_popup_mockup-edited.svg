<svg viewBox="0 0 610 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>PanelDue varied tile sizes popup mockup</title>
<desc>A 610 by 460 pixel dark themed popup with red border, showing a shorter name tile at the top, a row of three differently sized button tiles below it (a medium tile, a bigger tile, and a small tile), and three buttons at the bottom: a red cancel X button, a green confirm checkmark button, and a light blue button with a trash bin icon.</desc>

<rect x="0" y="0" width="610" height="460" fill="#12161c"/>
<rect x="6" y="6" width="598" height="448" rx="16" fill="#12161c" stroke="#e2453f" stroke-width="4"/>

<rect x="195" y="35" width="220" height="65" rx="10" fill="#1c222b" stroke="#3b434f" stroke-width="2"/>
<text x="305" y="75" text-anchor="middle" fill="#e5e8ec" font-size="22" font-weight="bold" font-family="Arial, sans-serif">shorter name tile</text>

<rect x="40" y="150" width="140" height="60" rx="10" fill="#1c222b" stroke="#3b434f" stroke-width="2"/>
<text x="110" y="176" text-anchor="middle" fill="#e5e8ec" font-size="14" font-weight="bold" font-family="Arial, sans-serif">medium button</text>
<text x="110" y="194" text-anchor="middle" fill="#e5e8ec" font-size="14" font-weight="bold" font-family="Arial, sans-serif">tile</text>

<rect x="195" y="150" width="220" height="60" rx="10" fill="#1c222b" stroke="#3b434f" stroke-width="2"/>
<text x="305" y="188" text-anchor="middle" fill="#e5e8ec" font-size="22" font-weight="bold" font-family="Arial, sans-serif">big button tile</text>

<rect x="430" y="150" width="110" height="60" rx="10" fill="#1c222b" stroke="#3b434f" stroke-width="2"/>
<text x="485" y="165" text-anchor="middle" fill="#e5e8ec" font-size="13" font-weight="bold" font-family="Arial, sans-serif">small</text>
<text x="485" y="181" text-anchor="middle" fill="#e5e8ec" font-size="13" font-weight="bold" font-family="Arial, sans-serif">button</text>
<text x="485" y="197" text-anchor="middle" fill="#e5e8ec" font-size="13" font-weight="bold" font-family="Arial, sans-serif">tile</text>

<rect x="120" y="324" width="110" height="80" rx="10" fill="#c0392f"/>
<line x1="145" y1="339" x2="205" y2="389" stroke="#3a0f0c" stroke-width="8" stroke-linecap="round"/>
<line x1="205" y1="339" x2="145" y2="389" stroke="#3a0f0c" stroke-width="8" stroke-linecap="round"/>

<rect x="250" y="324" width="110" height="80" rx="10" fill="#a4d65e"/>
<path d="M282,371 L302,391 L338,349" fill="none" stroke="#12161c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="380" y="324" width="110" height="80" rx="10" fill="#7cc3e8"/>
<line x1="405" y1="349" x2="465" y2="349" stroke="#0c2a3d" stroke-width="6" stroke-linecap="round"/>
<path d="M410,349 L460,349 L450,389 L420,389 Z" fill="none" stroke="#0c2a3d" stroke-width="6" stroke-linejoin="round"/>

</svg>
